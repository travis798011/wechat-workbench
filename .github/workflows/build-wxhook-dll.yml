name: Build wxhook DLL for 4.1.8.27

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build DLL with MSVC
        run: |
          cd bridge\WeChatApi-4.1.8.27-src
          cl /LD /Fe:wxhook-418.dll /I. /O2 /MT /GS- /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN /DNOMINMAX main.cpp HttpServer.cpp JsonLite.cpp LoginInitHook.cpp MessageCallback.cpp WeChatBridge.cpp httpapi.lib winhttp.lib
          Write-Host "---DLL created---"
          dir *.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: wxhook-418-dll
          path: bridge/WeChatApi-4.1.8.27-src/wxhook-418.dll
